# Gradle / Kotlin 构建参数：CI 与本地共用，不依赖隐式默认值。
#
# Kotlin 编译放在进程内。CI（ubuntu-latest）上让 KGP 起独立编译 daemon 时，
# :app:compileReleaseKotlin 曾静默挂到 job 超时——Gradle daemon 与 Kotlin
# compile daemon 两个 JVM 都活着，编译却再不返回。本模块只有 7 个源文件，
# 进程内编译不慢，且少一层跨进程握手。
kotlin.compiler.execution.strategy=in-process
# 进程内编译跑在这个堆里：4g 给编译器留足余量，Metaspace 1g 免得 AGP/R8 反复扩容。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
