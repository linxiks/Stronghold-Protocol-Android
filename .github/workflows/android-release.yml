name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '创建 GitHub Release 的 tag（留空则只上传 workflow artifact）'
        required: false
        type: string
        default: ''
      upstream_ref:
        description: 'Stronghold-Protocol 的 ref（sha/tag/branch，留空用固定 SHA）'
        required: false
        type: string
        default: ''

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/linxiks/Stronghold-Protocol.git
  UPSTREAM_REF_DEFAULT: 8cd6491e435f0a0355077b6162d1b17b77baa19e

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone upstream
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          ref="${UPSTREAM_REF:-$UPSTREAM_REF_DEFAULT}"
          git clone --branch master --single-branch "$UPSTREAM_REPO" "$GITHUB_WORKSPACE/../Stronghold-Protocol"
          git -C "$GITHUB_WORKSPACE/../Stronghold-Protocol" checkout --detach "$ref"
          git -C "$GITHUB_WORKSPACE/../Stronghold-Protocol" rev-parse HEAD

      - name: Install upstream dependencies
        working-directory: ${{ github.workspace }}/../Stronghold-Protocol
        run: npm ci --no-audit --no-fund

      - name: Prepare upstream build inputs
        run: node tools/prepare-upstream.mjs "$GITHUB_WORKSPACE/../Stronghold-Protocol"

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ -z "$tag" ] && [ "$EVENT_NAME" = "push" ]; then tag="$REF_NAME"; fi
          name="${tag#v}"
          [ -n "$name" ] || name="0.1.0-dev.${{ github.run_number }}"
          if printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            code=$(awk -F. '{print $1*10000 + $2*100 + $3}' <<<"$name")
          else
            code="${{ github.run_number }}"
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64：本次用 AGP 的 debug key 签名，产物可安装但不是正式签名。"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Point Gradle at the SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$sdk" ]; then echo "sdk.dir=$sdk" > local.properties; fi

      - name: Build release APK
        env:
          STRONGHOLD_VERSION_NAME: ${{ steps.version.outputs.name }}
          STRONGHOLD_VERSION_CODE: ${{ steps.version.outputs.code }}
          STRONGHOLD_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          STRONGHOLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STRONGHOLD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STRONGHOLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # CI 没有 .cache/assets-ledger.json，用 HEAD 的 Content-Length 补齐 asset-index.json 的文件大小。
          STRONGHOLD_FILL_ASSET_SIZES: '1'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease &
          build=$!
          # 曾经在 :app:compileReleaseKotlin 静默挂到 60 分钟超时。超过 20 分钟（从零构建约 5 分钟）即判为卡死：
          # 先导出 JVM 线程栈供定位，再终止构建让 job 立刻失败，而不是白等到超时。
          (
            sleep 1200
            kill -0 "$build" 2>/dev/null || exit 0
            echo "::error::构建已超过 20 分钟，判定为卡死；以下是各 JVM 的线程栈"
            for pid in $(pgrep java); do
              echo "=== jstack $pid ==="
              "$JAVA_HOME/bin/jstack" "$pid" 2>&1 || true
            done
            kill "$build" 2>/dev/null || true
          ) &
          watchdog=$!
          status=0
          wait "$build" || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$status"

      - name: Verify APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $apk"
          unzip -l "$apk" > "$RUNNER_TEMP/apk.list"
          for entry in \
            lib/arm64-v8a/libc++_shared.so \
            lib/arm64-v8a/libnode.so \
            lib/arm64-v8a/libnode_bridge.so \
            assets/stronghold-runtime.zip \
            assets/asset-index.json \
            assets/fonts/bender-regular.otf \
            assets/fonts/novecento-wide-normal.otf ; do
            grep -q "$entry" "$RUNNER_TEMP/apk.list" || { echo "::error::APK 缺少 $entry"; exit 1; }
          done
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "stronghold-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stronghold-apk
          path: stronghold-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          asset="stronghold-${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes --verify-tag
          fi
